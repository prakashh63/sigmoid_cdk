name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: npm install -g aws-cdk
      - name: Style
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Conventions
        run: python tools/check_conventions.py
      - name: Tests (unit, IAM, cdk-nag, snapshots)
        run: pytest -q
      - name: Synthesize example
        run: cdk synth --quiet
      - name: IAM report
        run: python tools/iam_report.py cdk.out
