<!doctype html>
<meta charset="utf-8">
<title>Customer Portal demo</title>
<body style="font-family:sans-serif;max-width:640px;margin:2rem auto">
<h2>Customer Portal demo</h2>
<p><input id="item" value="book"> <input id="qty" type="number" value="1" style="width:4rem">
<button onclick="createOrder()">Create order</button>
<button onclick="show('/api/orders')">Load orders</button></p>
<p><input id="usersUrl" placeholder="Users API URL from deploy output" style="width:70%">
<button onclick="getUser()">Get user</button></p>
<pre id="out">Press a button.</pre>
<script>
const out = document.getElementById("out");
async function show(url, options) {
  try {
    const r = await fetch(url, options);
    out.textContent = r.status + "\n" + JSON.stringify(await r.json(), null, 2);
  } catch (e) { out.textContent = "Error: " + e; }
}
function createOrder() {
  show("/api/orders", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({item: item.value, qty: Number(qty.value)})
  });
}
function getUser() { show(usersUrl.value.replace(/\/$/, "") + "/users/1"); }
</script>
